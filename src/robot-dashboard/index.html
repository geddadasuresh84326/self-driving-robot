<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROS Dual Camera Dashboard</title>

    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- ROSLIBJS for ROS Web Bridge Communication -->
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
</head>

<body>

    <!-- Header / Connection Control -->
    <header>
        <h1>Robot Camera Dashboard</h1>
        <div id="connection-container">
            <span id="connection-status" class="disconnected">Disconnected</span>
            <input type="text" id="ws-url" value="ws://192.168.1.6:9090" placeholder="ws://<ROBOT_IP>:9090">
            <button id="connect-btn">Connect</button>
        </div>
    </header>

    <main class="dashboard-grid">
        <!-- Dual Camera Video Stream Row -->
        <div class="streams-container">
            <!-- Screen 1: Raw Camera Feed -->
            <section class="card camera-card">
                <h2>Raw Camera <code>(/line_detection/stream/compressed)</code></h2>
                <div class="camera-container">
                    <img id="raw-camera-feed" src="" alt="Raw Camera Stream Offline" />
                </div>
                <div class="telemetry-info">
                    <span>FPS: <strong id="raw-fps-counter">0</strong></span>
                    <span>Frame Size: <strong id="raw-img-size">0 KB</strong></span>
                </div>
            </section>

            <!-- Screen 2: ArUco Detection Stream -->
            <section class="card camera-card">
                <h2>ArUco Detection <code>(/aruco_detection/stream/compressed)</code></h2>
                <div class="camera-container">
                    <img id="aruco-camera-feed" src="" alt="ArUco Stream Offline" />
                </div>
                <div class="telemetry-info">
                    <span>FPS: <strong id="aruco-fps-counter">0</strong></span>
                    <span>Frame Size: <strong id="aruco-img-size">0 KB</strong></span>
                </div>
            </section>
        </div>

        <!-- Connection Logs Panel -->
        <section class="card log-card">
            <h2>Connection Logs</h2>
            <div id="log-console">
                <p class="system-msg">[System] Ready to connect to rosbridge server.</p>
            </div>
        </section>
    </main>

    <!-- Main Logic JavaScript -->
    <script src="app.js"></script>
</body>

</html>
